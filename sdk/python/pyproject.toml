[project]
name = "quotescribe"
version = "0.1.0"
description = "Official Python SDK for the QuoteScribe API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = ["requests>=2.28"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["quotescribe*"]
